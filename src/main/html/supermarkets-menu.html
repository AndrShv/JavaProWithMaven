<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Delivery Menu</title>
    <link rel="stylesheet" href="/src/main/css/supermarket-menu-style.css">
</head>
<body>
<div class="container">
    <h1>Supermarket Delivery Menu</h1>
    <div class="search-container">
        <input type="text" id="search" placeholder="Search items...">
        <button type="button" class="search-button">Search</button>
    </div>
    <div class="menu">
        <details class="category">
            <summary>Fruits & Vegetables</summary>
            <ul class="item-list">
                <li class="item">
                    <span class="item-name">Apples</span>
                    <span class="item-price">$1.99</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Bananas</span>
                    <span class="item-price">$0.99</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Carrots</span>
                    <span class="item-price">$1.49</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Spinach</span>
                    <span class="item-price">$2.49</span>
                    <button class="add-button">Add</button>
                </li>
            </ul>
        </details>
        <details class="category">
            <summary>Dairy & Eggs</summary>
            <ul class="item-list">
                <li class="item">
                    <span class="item-name">Milk</span>
                    <span class="item-price">$3.49</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Cheese</span>
                    <span class="item-price">$4.99</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Eggs</span>
                    <span class="item-price">$2.99</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Yogurt</span>
                    <span class="item-price">$1.99</span>
                    <button class="add-button">Add</button>
                </li>
            </ul>
        </details>
        <details class="category">
            <summary>Bakery</summary>
            <ul class="item-list">
                <li class="item">
                    <span class="item-name">Bread</span>
                    <span class="item-price">$2.49</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Croissants</span>
                    <span class="item-price">$3.99</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Muffins</span>
                    <span class="item-price">$4.49</span>
                    <button class="add-button">Add</button>
                </li>
                <li class="item">
                    <span class="item-name">Bagels</span>
                    <span class="item-price">$3.99</span>
                    <button class="add-button">Add</button>
                </li>
            </ul>
        </details>
    </div>
</div>
</body>
</html>
